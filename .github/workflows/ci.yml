name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上新的 push 取消掉还在跑的旧 run，省 Actions 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 版本来自 .nvmrc，和本地开发保持一致；Vercel 侧由 package.json 的 engines.node 决定
          node-version-file: .nvmrc
          cache: npm

      # Next.js 的增量构建缓存，能明显缩短后续 build
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', '*.ts', '*.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 有 high 及以上漏洞就红。若某个传递依赖长期没有修复版导致噪音过大，
      # 可临时在本步骤加 continue-on-error: true，而不是放宽 --audit-level。
      - run: npm audit --audit-level=high
